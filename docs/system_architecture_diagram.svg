<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    RolexHound File Monitoring System Architecture
  </text>
  
  <!-- Main Container -->
  <rect x="50" y="70" width="1100" height="680" fill="none" stroke="#34495e" stroke-width="2" rx="10"/>
  
  <!-- User Space -->
  <rect x="80" y="100" width="1040" height="120" fill="#ecf0f1" stroke="#95a5a6" stroke-width="1" rx="5"/>
  <text x="100" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">User Space</text>
  
  <!-- Command Line Interface -->
  <rect x="120" y="150" width="200" height="50" fill="#3498db" stroke="#2980b9" stroke-width="1" rx="5"/>
  <text x="220" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Command Line</text>
  <text x="220" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Interface</text>
  
  <!-- Signal Handler -->
  <rect x="360" y="150" width="200" height="50" fill="#e74c3c" stroke="#c0392b" stroke-width="1" rx="5"/>
  <text x="460" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Signal Handler</text>
  <text x="460" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">(CTRL+C)</text>
  
  <!-- Output Display -->
  <rect x="600" y="150" width="200" height="50" fill="#27ae60" stroke="#229954" stroke-width="1" rx="5"/>
  <text x="700" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Output Display</text>
  <text x="700" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">(Console)</text>
  
  <!-- Application Space -->
  <rect x="80" y="250" width="1040" height="300" fill="#e8f6f3" stroke="#27ae60" stroke-width="1" rx="5"/>
  <text x="100" y="280" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Application Space</text>
  
  <!-- Main Monitoring Loop -->
  <rect x="120" y="300" width="960" height="200" fill="#ffffff" stroke="#3498db" stroke-width="2" rx="5"/>
  <text x="600" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Main Monitoring Loop</text>
  
  <!-- Path Parser -->
  <rect x="150" y="350" width="150" height="70" fill="#f39c12" stroke="#e67e22" stroke-width="1" rx="5"/>
  <text x="225" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Path Parser</text>
  <text x="225" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">strtok()</text>
  <text x="225" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">basename extraction</text>
  
  <!-- File Discovery -->
  <rect x="320" y="350" width="150" height="70" fill="#9b59b6" stroke="#8e44ad" stroke-width="1" rx="5"/>
  <text x="395" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">File Discovery</text>
  <text x="395" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">FindFirstFile()</text>
  <text x="395" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Handle validation</text>
  
  <!-- Attribute Monitor -->
  <rect x="490" y="350" width="150" height="70" fill="#1abc9c" stroke="#16a085" stroke-width="1" rx="5"/>
  <text x="565" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Attribute Monitor</text>
  <text x="565" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">FILETIME compare</text>
  <text x="565" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Change detection</text>
  
  <!-- Sleep Timer -->
  <rect x="660" y="350" width="150" height="70" fill="#e67e22" stroke="#d35400" stroke-width="1" rx="5"/>
  <text x="735" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Sleep Timer</text>
  <text x="735" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">sleep(10)</text>
  <text x="735" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">10s interval</text>
  
  <!-- Memory Manager -->
  <rect x="830" y="350" width="150" height="70" fill="#34495e" stroke="#2c3e50" stroke-width="1" rx="5"/>
  <text x="905" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Memory Manager</text>
  <text x="905" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">malloc()</text>
  <text x="905" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Dynamic allocation</text>
  
  <!-- Data Structures -->
  <rect x="150" y="440" width="830" height="40" fill="#bdc3c7" stroke="#95a5a6" stroke-width="1" rx="5"/>
  <text x="565" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">
    Data Structures: WIN32_FIND_DATA | FILETIME | HANDLE | char* basePath
  </text>
  
  <!-- System Layer -->
  <rect x="80" y="580" width="1040" height="120" fill="#f7dc6f" stroke="#f1c40f" stroke-width="1" rx="5"/>
  <text x="100" y="610" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Windows System Layer</text>
  
  <!-- Windows API -->
  <rect x="120" y="630" width="200" height="50" fill="#f39c12" stroke="#e67e22" stroke-width="1" rx="5"/>
  <text x="220" y="650" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Windows API</text>
  <text x="220" y="665" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">FindFirstFile, GetFileAttributes</text>
  
  <!-- File System -->
  <rect x="360" y="630" width="200" height="50" fill="#27ae60" stroke="#229954" stroke-width="1" rx="5"/>
  <text x="460" y="650" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">File System</text>
  <text x="460" y="665" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">NTFS/FAT32</text>
  
  <!-- Signal System -->
  <rect x="600" y="630" width="200" height="50" fill="#8e44ad" stroke="#732d91" stroke-width="1" rx="5"/>
  <text x="700" y="650" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Signal System</text>
  <text x="700" y="665" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">SIGINT handling</text>
  
  <!-- Process Management -->
  <rect x="840" y="630" width="200" height="50" fill="#e74c3c" stroke="#c0392b" stroke-width="1" rx="5"/>
  <text x="940" y="650" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">Process Management</text>
  <text x="940" y="665" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">getpid(), exit()</text>
  
  <!-- Arrows -->
  <!-- CLI to Path Parser -->
  <line x1="220" y1="200" x2="225" y2="350" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Path Parser to File Discovery -->
  <line x1="300" y1="385" x2="320" y2="385" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- File Discovery to Attribute Monitor -->
  <line x1="470" y1="385" x2="490" y2="385" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Attribute Monitor to Sleep Timer -->
  <line x1="640" y1="385" x2="660" y2="385" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Sleep Timer to Memory Manager -->
  <line x1="810" y1="385" x2="830" y2="385" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Loop back arrow -->
  <path d="M 980 385 Q 1020 385 1020 300 Q 1020 260 150 260 Q 110 260 110 350" 
        fill="none" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,5"/>
  
  <!-- Signal Handler to Sleep Timer -->
  <line x1="460" y1="200" x2="735" y2="350" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="3,3"/>
  
  <!-- Output arrows -->
  <line x1="565" y1="420" x2="700" y2="350" stroke="#27ae60" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- System layer arrows -->
  <line x1="395" y1="420" x2="220" y2="630" stroke="#f39c12" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="395" y1="420" x2="460" y2="630" stroke="#27ae60" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="460" y1="200" x2="700" y2="630" stroke="#8e44ad" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="905" y1="420" x2="940" y2="630" stroke="#e74c3c" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>
  
  <!-- Legend -->
  <rect x="1020" y="120" width="150" height="140" fill="white" stroke="#95a5a6" stroke-width="1" rx="5"/>
  <text x="1095" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Legend</text>
  
  <rect x="1030" y="150" width="15" height="15" fill="#3498db"/>
  <text x="1055" y="162" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">User Interface</text>
  
  <rect x="1030" y="170" width="15" height="15" fill="#e74c3c"/>
  <text x="1055" y="182" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Signal Handling</text>
  
  <rect x="1030" y="190" width="15" height="15" fill="#27ae60"/>
  <text x="1055" y="202" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Output/File System</text>
  
  <line x1="1030" y1="215" x2="1045" y2="215" stroke="#2c3e50" stroke-width="2"/>
  <text x="1055" y="218" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Data Flow</text>
  
  <line x1="1030" y1="235" x2="1045" y2="235" stroke="#e74c3c" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="1055" y="238" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Interrupt Flow</text>
</svg>